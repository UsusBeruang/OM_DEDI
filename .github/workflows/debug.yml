name: debug

on:
  push:
    branches-ignore:
      - 'release/**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-debug:
    name: Debug build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OM_DEDI.sln

      - name: Build Debug
        run: dotnet build OM_DEDI.sln --configuration Debug --no-restore
