name: debug

on:
  push:
    branches-ignore:
      - 'release/**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Debug build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OM_DEDI.sln

      - name: Build Debug
        run: dotnet build OM_DEDI.sln --configuration Debug --no-restore

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: OM_DEDI-debug
          path: src/OM.Dedi.Host/bin/Debug/net8.0/
          if-no-files-found: error
          retention-days: 7
